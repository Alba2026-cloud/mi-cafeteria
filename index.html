<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Cafetería</title>

    <style>
        body {
            background-color: #f5eadb;
            font-family: Arial;
            text-align: center;
            color: #593b2b;
            padding: 30px;
        }

        .caja {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #8b4513;
        }

        h2 {
            color: #a66b42;
        }

        button {
            background-color: #8b4513;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
        }
    </style>

</head>

<body>

    <div class="caja">

        <h1>☕ Mi Cafetería</h1>

        <h2>Un café para disfrutar</h2>

        <p>
            El mejor lugar para compartir
            momentos especiales.
        </p>

        <h2>Nuestro menú</h2>

        <p>☕ Café americano - $1.50</p>

        <p>🥛 Capuchino - $2.00</p>

        <p>🍫 Chocolate caliente - $1.75</p>

        <button>Contáctanos</button>

        <p>¡Te esperamos!</p>

    </div>

</body>
</html>
